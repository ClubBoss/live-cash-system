name: V6 Wave B Targeted Validation

on:
  push:
    branches:
      - openai/v6-wave-b-learner-presentation-firewall

permissions:
  contents: read

concurrency:
  group: v6-wave-b-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted:
    name: Static + unit + Chromium
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/live-cash-os
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/live-cash-os/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint owned surface
        run: npx eslint components/PracticalLearnerPresentationGuard.tsx components/SupportingToolsApp.tsx lib/learner-presentation-firewall.ts tests/learner-presentation-firewall.test.mjs e2e/learner-presentation-firewall.spec.mjs
      - name: Learner presentation invariant
        run: node --import ./tests/register-model-loader.mjs --test tests/learner-presentation-firewall.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Representative Chromium flow
        run: npx playwright test e2e/learner-presentation-firewall.spec.mjs --project=chromium
