name: Post Deploy Run Audit

on:
  pull_request:
    paths:
      - ".github/workflows/post-deploy-run-audit.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect-main-release:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact-main workflow and deploy jobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA: d5e4583414d88e05d014d352fdafd63790203a59
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          curl --fail --silent --show-error "${auth[@]}" "${api}/actions/runs?branch=main&event=push&per_page=20" > runs.json
          node -e '
            const fs=require("fs");
            const data=JSON.parse(fs.readFileSync("runs.json","utf8"));
            const sha=process.env.EXPECTED_SHA;
            const matches=(data.workflow_runs||[]).filter(r=>r.head_sha===sha);
            console.log(JSON.stringify(matches.map(r=>({id:r.id,name:r.name,event:r.event,status:r.status,conclusion:r.conclusion,head_sha:r.head_sha,run_number:r.run_number,created_at:r.created_at,updated_at:r.updated_at,html_url:r.html_url})),null,2));
            if(matches.length===0) process.exit(2);
            const preferred=matches.find(r=>r.name==="Live Cash OS CI") ?? matches[0];
            process.stdout.write(`\nSELECTED_RUN_ID=${preferred.id}\n`);
          ' | tee run-audit.txt

          run_id="$(grep '^SELECTED_RUN_ID=' run-audit.txt | tail -n1 | cut -d= -f2)"
          test -n "$run_id"
          curl --fail --silent --show-error "${auth[@]}" "${api}/actions/runs/${run_id}/jobs?per_page=100" > jobs.json
          node -e '
            const fs=require("fs");
            const data=JSON.parse(fs.readFileSync("jobs.json","utf8"));
            const jobs=(data.jobs||[]).map(j=>({id:j.id,name:j.name,status:j.status,conclusion:j.conclusion,started_at:j.started_at,completed_at:j.completed_at,steps:(j.steps||[]).map(s=>({name:s.name,status:s.status,conclusion:s.conclusion,number:s.number}))}));
            console.log(JSON.stringify(jobs,null,2));
            const validate=jobs.find(j=>j.name==="validate");
            const deploy=jobs.find(j=>j.name==="deploy-test-mirror");
            if(!validate) throw new Error("exact-main validate job missing");
            if(validate.conclusion!=="success") process.exit(3);
            if(!deploy) throw new Error("exact-main deploy-test-mirror job missing");
            if(deploy.conclusion!=="success") process.exit(4);
          ' | tee job-audit.txt

          echo "EXACT_MAIN_RUN_AND_DEPLOY_GREEN sha=${EXPECTED_SHA} run_id=${run_id}"

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: post-deploy-run-audit
          path: |
            run-audit.txt
            job-audit.txt
            runs.json
            jobs.json
          if-no-files-found: ignore
          retention-days: 7
