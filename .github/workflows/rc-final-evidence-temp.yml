name: Final Red-Team exact-final evidence 2

on:
  push:
    branches: [repair/final-red-team-closure]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      final_sha: ${{ steps.freeze.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/final-red-team-closure
          fetch-depth: 0
      - name: Remove temporary harness and freeze branch
        id: freeze
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rc-final-evidence-temp.yml
          git commit -m "chore: remove one-time exact-final evidence harness"
          git push origin HEAD:repair/final-red-team-closure
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "sha=${FINAL_SHA}" >> "$GITHUB_OUTPUT"
          echo "Exact final SHA: ${FINAL_SHA}"
          test ! -e .github/workflows/rc-final-evidence-temp.yml
          git diff --exit-code

  release:
    needs: finalize
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/live-cash-os
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.finalize.outputs.final_sha }}
      - name: Verify exact final SHA
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.finalize.outputs.final_sha }}"
          echo "Release SHA: $(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/live-cash-os/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exact-final release gate
        run: npm run test:release

  cross-browser:
    needs: [finalize, release]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/live-cash-os
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.finalize.outputs.final_sha }}
      - name: Verify exact final SHA
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.finalize.outputs.final_sha }}"
          echo "Cross-browser SHA: $(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/live-cash-os/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Exact-final six-project matrix
        run: npx playwright test e2e/wave8-ux.spec.mjs --config=playwright.cross-browser.config.mjs
