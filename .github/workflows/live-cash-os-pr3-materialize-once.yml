name: Live Cash OS PR3 Materialize Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-cash-os-pr3-materialize-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-cash-os-pr3-materialize-once
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Clone current PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --branch agent/live-cash-os-bilingual-copy-pass --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" work
      - name: Install dependencies
        working-directory: work/apps/live-cash-os
        run: npm install --no-audit --no-fund
      - name: Materialize final runtime and source-locked drafts
        working-directory: work/apps/live-cash-os
        run: |
          node scripts/prepare-bilingual-version.mjs
          node scripts/apply-bilingual-runtime.mjs
          node scripts/postprocess-bilingual-runtime.mjs
          node scripts/add-learning-route.mjs
          node scripts/i18n-extract.mjs
          node scripts/i18n-sync.mjs
          node scripts/i18n-curated-overrides.mjs
          node scripts/i18n-review-current.mjs
          ALLOW_DRAFT_I18N=1 npm run i18n:check
          npm run typecheck
      - name: Commit outputs to PR branch
        working-directory: work
        run: |
          paths=(
            apps/live-cash-os/package-lock.json
            apps/live-cash-os/components/LiveCashApp.tsx
            apps/live-cash-os/app/globals.css
            apps/live-cash-os/lib/model.ts
            apps/live-cash-os/content/modules.ts
            apps/live-cash-os/public/manifest.webmanifest
            apps/live-cash-os/public/sw.js
            apps/live-cash-os/content/i18n/source.ru.json
            apps/live-cash-os/content/i18n/ru.json
            apps/live-cash-os/content/i18n/en.json
            apps/live-cash-os/content/i18n/review-lock.json
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "No materialized changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "Materialize bilingual runtime and source-locked drafts"
          git pull --rebase origin agent/live-cash-os-bilingual-copy-pass
          git push origin HEAD:agent/live-cash-os-bilingual-copy-pass
