name: W6 Agent Implementation

on:
  push:
    branches:
      - wave/w6-adaptive-scheduler
    paths:
      - .github/workflows/w6-agent-implementation.yml

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wave/w6-adaptive-scheduler
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/live-cash-os/package-lock.json
      - name: Recover and apply bounded W6 patch
        shell: bash
        run: |
          git show 1ea598cdb26445ee46e898a9b6b926e716212ee8:.github/workflows/w6-agent-implementation.yml > /tmp/w6-source.yml
          python <<'PY'
          from pathlib import Path
          lines = Path('/tmp/w6-source.yml').read_text(encoding='utf-8').splitlines()
          start = next(index for index, line in enumerate(lines) if line.strip() == "python <<'PY'") + 1
          end = next(index for index in range(start, len(lines)) if lines[index].strip() == 'PY')
          body = [line[10:] if line.startswith('          ') else line for line in lines[start:end]]
          patch = '\n'.join(body) + '\n'
          old = '  const newAllowed = options.budget !== "post" && !hasUnresolvedRepair && !recentLessonExposure(state, options.now);'
          new = '  const newAllowed = options.budget !== "post" && options.budget !== "5" && !hasUnresolvedRepair && !recentLessonExposure(state, options.now);'
          if old not in patch:
              raise SystemExit('five-minute policy patch target not found')
          Path('/tmp/w6_apply.py').write_text(patch.replace(old, new, 1), encoding='utf-8')
          PY
          python /tmp/w6_apply.py
          python <<'PY'
          from pathlib import Path
          import json
          core = Path('apps/live-cash-os/components/LiveCashAppCore.tsx')
          text = core.read_text(encoding='utf-8')
          old = '  function openReview() {\n    const drills = selectReview(state);'
          new = '  function openReview(limit = 3) {\n    const drills = selectReview(state, limit);'
          if old not in text:
              raise SystemExit('openReview wiring target not found')
          text = text.replace(old, new, 1).replace('  MODULE_IDS,\n', '', 1)
          empty_old = '  if (!card) return <section className="surface"><div className="empty-state"><h2>{t.allCardsDone}</h2></div></section>;'
          empty_new = '  if (!card) return <section className="surface"><p className="eyebrow">{recallLabel(locale)}</p><div className="empty-state"><h2>{locale === "ru" ? "Пока нечего повторять." : "Nothing to review yet."}</h2><p>{locale === "ru" ? "После первого урока здесь появятся короткие карточки по уже изученным темам." : "After your first lesson, short cards from topics you have already seen will appear here."}</p></div></section>;'
          if empty_old not in text:
              raise SystemExit('cards empty-state target not found')
          text = text.replace(empty_old, empty_new, 1)
          core.write_text(text, encoding='utf-8')

          e2e_path = Path('apps/live-cash-os/e2e/live-cash.spec.mjs')
          e2e = e2e_path.read_text(encoding='utf-8')
          selector_old = 'name: /Сохранить и выйти/u'
          selector_new = 'name: /Выйти и сохранить/u'
          if selector_old not in e2e:
              raise SystemExit('resume selector target not found')
          e2e_path.write_text(e2e.replace(selector_old, selector_new, 1), encoding='utf-8')

          manifest_path = Path('apps/live-cash-os/content/i18n/editorial-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          language_paths = manifest.setdefault('repair_source_paths', {}).setdefault('language', [])
          core_path = 'components/LiveCashAppCore.tsx'
          if core_path not in language_paths:
              language_paths.append(core_path)
          manifest['final_composition']['note'] = 'W1-W5 integrated learner-facing composition plus the bounded W6 Today/scheduler/resume surface is materialized. Strategy, drill and exact integrated RU/EN human review remain pending; this candidate does not claim approval.'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Install dependencies
        working-directory: apps/live-cash-os
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: apps/live-cash-os
        run: npx playwright install --with-deps chromium
      - name: Targeted W6 unit and truth checks
        working-directory: apps/live-cash-os
        run: |
          node --import ./tests/register-model-loader.mjs --test tests/scheduler.test.mjs tests/kernel-content.test.mjs tests/model-integrity-facade.test.mjs tests/repair-order.test.mjs tests/taxonomy-scope.test.mjs
          npm run typecheck
          npm run check:governance
          npm run check:editorial
      - name: Targeted W6 E2E checks
        working-directory: apps/live-cash-os
        run: npx playwright test e2e/live-cash.spec.mjs --grep "direct learner labels|Save and exit|W6 Today"
      - name: Full release validation
        working-directory: apps/live-cash-os
        run: npm run test:release
      - name: Commit W6 implementation
        shell: bash
        run: |
          git config user.name "OpenAI Wave 6 Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/live-cash-os/lib/model-core.ts apps/live-cash-os/lib/scheduler.ts apps/live-cash-os/lib/runtime-repair-registry.ts apps/live-cash-os/components/LiveCashAppCore.tsx apps/live-cash-os/content/i18n/editorial-manifest.json apps/live-cash-os/tests/scheduler.test.mjs apps/live-cash-os/e2e/live-cash.spec.mjs
          git diff --cached --check
          git commit -m "Implement adaptive daily scheduler"
          git push origin HEAD:wave/w6-adaptive-scheduler
