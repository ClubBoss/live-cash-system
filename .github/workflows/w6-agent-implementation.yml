          model = regex_once(model, r'''function queueReview\(state: LearnerState, input: DrillEvidenceInput, interactionId: string, passed: boolean\) \{.*?\n\}\nfunction normalizeTransferProbe''', '''function queueReview(state: LearnerState, input: DrillEvidenceInput, interactionId: string, passed: boolean) {
  const kind: ReviewItem["kind"] = passed ? "retention" : "repair";
  const dueAt = new Date(Date.now() + (passed ? 24 * 60 * 60 * 1000 : 0)).toISOString();
  const existing = state.reviewQueue.find((item) => item.moduleId === input.moduleId && item.variantGroup === input.variantGroup && item.kind === kind);
  if (existing) {
    existing.dueAt = new Date(Math.min(Date.parse(existing.dueAt), Date.parse(dueAt))).toISOString();
    existing.sourceInteractionId = interactionId;
    existing.sourceDrillId = input.drillId;
    existing.sourceActionOptionId = input.selectedActionOptionId;
    existing.sourceReasonOptionId = input.selectedReasonOptionId;
    return;
  }
