  "geo-03::geo-03-a2": { errorKey: "starting-depth-vs-post-action-spr", preferredVariantGroup: "future-spr", preferredNodeKey: "nominal-400bb-compressed", preferredKind: "changed", fallbackKind: "boundary" },
