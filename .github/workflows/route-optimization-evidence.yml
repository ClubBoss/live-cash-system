name: Route Optimization Evidence

on:
  push:
    branches:
      - wave/route-optimization

permissions:
  contents: read

concurrency:
  group: route-optimization-evidence
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/live-cash-os/package-lock.json
      - name: Install dependencies
        working-directory: apps/live-cash-os
        run: npm ci
      - name: Install Playwright browsers
        working-directory: apps/live-cash-os
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Full release gate
        working-directory: apps/live-cash-os
        run: npm run test:release
      - name: Cross-browser route and session integrity
        working-directory: apps/live-cash-os
        run: npx playwright test e2e/route-optimization.spec.mjs e2e/session-render-integrity.spec.mjs --config=playwright.cross-browser.config.mjs
