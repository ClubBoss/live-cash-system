name: Route Optimization Materialize

on:
  push:
    branches:
      - wave/route-optimization

permissions:
  contents: write

concurrency:
  group: route-optimization-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded route source patch
        run: node apps/live-cash-os/scripts/route-optimization-build.mjs
      - name: Persist product source only
        shell: bash
        run: |
          git add apps/live-cash-os/lib/scheduler.ts \
                  apps/live-cash-os/components/LiveCashAppCore.tsx \
                  apps/live-cash-os/components/Wave7Experience.tsx
          if git diff --cached --quiet; then
            echo "Route source already materialized."
            exit 0
          fi
          git config user.name "ClubBoss"
          git config user.email "esalimzade@hotmail.com"
          git commit -m "RO-2/RO-5: materialize audited route policy"
          git push origin HEAD:wave/route-optimization
