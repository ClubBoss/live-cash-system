name: Live Cash OS Deduplicate Once

on:
  push:
    branches:
      - agent/live-cash-os-six-wave-rebuild
    paths:
      - ".github/workflows/live-cash-os-deduplicate-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-cash-os-six-wave-rebuild
          fetch-depth: 0
      - name: Remove duplicate integrity insertions
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("apps/live-cash-os/components/LiveCashApp.tsx")
          text = app.read_text(encoding="utf-8")

          duplicate_line = (
              '  const baselineEligible = state.interactions.length === 0 && modules.every((module) => !state.modules[module.id].contentCompleted);\n'
              '  const baselineEligible = state.interactions.length === 0 && modules.every((module) => !state.modules[module.id].contentCompleted);'
          )
          single_line = '  const baselineEligible = state.interactions.length === 0 && modules.every((module) => !state.modules[module.id].contentCompleted);'
          if duplicate_line not in text:
              raise SystemExit("Duplicate baselineEligible declaration not found")
          text = text.replace(duplicate_line, single_line, 1)

          duplicate_property = (
              'measurement_context: baselineEligible ? "COLD_BASELINE" : "POST_LEARNING_DIAGNOSTIC", '
              'measurement_context: baselineEligible ? "COLD_BASELINE" : "POST_LEARNING_DIAGNOSTIC", '
          )
          single_property = 'measurement_context: baselineEligible ? "COLD_BASELINE" : "POST_LEARNING_DIAGNOSTIC", '
          if duplicate_property not in text:
              raise SystemExit("Duplicate measurement_context property not found")
          text = text.replace(duplicate_property, single_property, 1)

          app.write_text(text, encoding="utf-8")
          Path(".github/workflows/live-cash-os-deduplicate-once.yml").unlink()
          PY
      - name: Commit deduplication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deduplicate final diagnostic integrity patch"
          git push origin HEAD:agent/live-cash-os-six-wave-rebuild
