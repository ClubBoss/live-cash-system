name: Live Cash OS i18n Sync

on:
  workflow_dispatch:
  push:
    branches:
      - agent/live-cash-os-bilingual-copy-pass
    paths:
      - "apps/live-cash-os/content/i18n/source.ru.json"
      - "apps/live-cash-os/scripts/i18n-sync.mjs"
      - ".github/workflows/live-cash-os-i18n-sync.yml"

permissions:
  contents: write

concurrency:
  group: live-cash-os-i18n-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/live-cash-os
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-cash-os-bilingual-copy-pass
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Generate or refresh translation drafts
        run: node scripts/i18n-sync.mjs
      - name: Commit translation memory
        run: |
          if git diff --quiet -- content/i18n/ru.json content/i18n/en.json; then
            echo "Translation memory already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/i18n/ru.json content/i18n/en.json
          git commit -m "Sync bilingual learner-copy drafts"
          git push origin HEAD:agent/live-cash-os-bilingual-copy-pass
