name: V6 Quick Start Targeted

on:
  push:
    branches:
      - fix/v6-quick-start-reachability

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/live-cash-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/live-cash-os/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Touched ESLint
        run: npx eslint lib/practical-first-journey.ts content/practical-mastery/index.ts content/practical-mastery/practical-ru-final-polish.ts tests/v6-quick-start-reachability.test.mjs e2e/v6-quick-start-reachability.spec.mjs
      - name: V6 reachability unit
        run: node --import ./tests/register-model-loader.mjs --test tests/v6-quick-start-reachability.test.mjs tests/practical-first-journey.test.mjs tests/practical-first-journey-authority.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: V6 Quick Start Chromium
        run: npx playwright test e2e/v6-quick-start-reachability.spec.mjs e2e/v4-wave-a-quick-start-authority.spec.mjs --project=chromium
