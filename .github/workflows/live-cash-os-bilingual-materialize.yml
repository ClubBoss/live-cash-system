name: Live Cash OS Bilingual Materialize

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/live-cash-os-bilingual-materialize.yml"
      - "apps/live-cash-os/scripts/apply-bilingual-runtime.mjs"
      - "apps/live-cash-os/scripts/postprocess-bilingual-runtime.mjs"
      - "apps/live-cash-os/scripts/prepare-bilingual-version.mjs"
      - "apps/live-cash-os/scripts/i18n-extract.mjs"
      - "apps/live-cash-os/scripts/i18n-sync.mjs"
      - "apps/live-cash-os/scripts/i18n-curated-overrides.mjs"
      - "apps/live-cash-os/scripts/i18n-review-current.mjs"
      - "apps/live-cash-os/scripts/i18n-check.mjs"
  push:
    branches:
      - agent/live-cash-os-bilingual-copy-pass
    paths:
      - ".github/workflows/live-cash-os-bilingual-materialize.yml"
      - "apps/live-cash-os/scripts/apply-bilingual-runtime.mjs"
      - "apps/live-cash-os/scripts/postprocess-bilingual-runtime.mjs"
      - "apps/live-cash-os/scripts/prepare-bilingual-version.mjs"
      - "apps/live-cash-os/scripts/i18n-extract.mjs"
      - "apps/live-cash-os/scripts/i18n-sync.mjs"
      - "apps/live-cash-os/scripts/i18n-curated-overrides.mjs"
      - "apps/live-cash-os/scripts/i18n-review-current.mjs"
      - "apps/live-cash-os/scripts/i18n-check.mjs"

permissions:
  contents: write

concurrency:
  group: live-cash-os-bilingual-materialize
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Clone the working branch without marketplace actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --branch agent/live-cash-os-bilingual-copy-pass --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" work
      - name: Install dependencies and refresh lockfile
        working-directory: work/apps/live-cash-os
        run: npm install --no-audit --no-fund
      - name: Prepare bilingual version authority
        working-directory: work/apps/live-cash-os
        run: node scripts/prepare-bilingual-version.mjs
      - name: Apply bilingual runtime
        working-directory: work/apps/live-cash-os
        run: node scripts/apply-bilingual-runtime.mjs
      - name: Postprocess locale-stable runtime
        working-directory: work/apps/live-cash-os
        run: node scripts/postprocess-bilingual-runtime.mjs
      - name: Extract stable learner-copy keys
        working-directory: work/apps/live-cash-os
        run: node scripts/i18n-extract.mjs
      - name: Refresh translation drafts
        working-directory: work/apps/live-cash-os
        run: node scripts/i18n-sync.mjs
      - name: Apply curated LCM-01 copy
        working-directory: work/apps/live-cash-os
        run: node scripts/i18n-curated-overrides.mjs
      - name: Run semantic draft audit without granting review status
        working-directory: work/apps/live-cash-os
        run: node scripts/i18n-review-current.mjs
      - name: Verify draft integrity
        working-directory: work/apps/live-cash-os
        run: ALLOW_DRAFT_I18N=1 npm run i18n:check
      - name: Verify runtime compiles before committing drafts
        working-directory: work/apps/live-cash-os
        run: npm run typecheck
      - name: Commit materialized runtime and audited draft locale memories
        working-directory: work
        run: |
          paths=(
            apps/live-cash-os/package-lock.json
            apps/live-cash-os/components/LiveCashApp.tsx
            apps/live-cash-os/app/globals.css
            apps/live-cash-os/lib/model.ts
            apps/live-cash-os/public/manifest.webmanifest
            apps/live-cash-os/public/sw.js
            apps/live-cash-os/content/i18n/source.ru.json
            apps/live-cash-os/content/i18n/ru.json
            apps/live-cash-os/content/i18n/en.json
            apps/live-cash-os/content/i18n/review-lock.json
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "Bilingual runtime already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "Materialize bilingual runtime and audited translation drafts"
          git pull --rebase origin agent/live-cash-os-bilingual-copy-pass
          git push origin HEAD:agent/live-cash-os-bilingual-copy-pass
