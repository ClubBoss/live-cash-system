name: Live Cash OS Bilingual Materialize

on:
  workflow_dispatch:
  push:
    branches:
      - agent/live-cash-os-bilingual-copy-pass
    paths:
      - ".github/workflows/live-cash-os-bilingual-materialize.yml"

permissions:
  contents: write

concurrency:
  group: live-cash-os-bilingual-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: macos-13
    timeout-minutes: 30
    steps:
      - name: Clone the working branch without marketplace actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --branch agent/live-cash-os-bilingual-copy-pass --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" work
      - name: Install script dependencies
        working-directory: work/apps/live-cash-os
        run: npm install --no-audit --no-fund
      - name: Apply bilingual runtime
        working-directory: work/apps/live-cash-os
        run: node scripts/apply-bilingual-runtime.mjs
      - name: Extract stable learner-copy keys
        working-directory: work/apps/live-cash-os
        run: node scripts/i18n-extract.mjs
      - name: Refresh translation memory
        working-directory: work/apps/live-cash-os
        run: node scripts/i18n-sync.mjs
      - name: Commit materialized runtime and locale memories
        working-directory: work
        run: |
          if git diff --quiet -- apps/live-cash-os/components/LiveCashApp.tsx apps/live-cash-os/app/globals.css apps/live-cash-os/content/i18n/source.ru.json apps/live-cash-os/content/i18n/ru.json apps/live-cash-os/content/i18n/en.json; then
            echo "Bilingual runtime already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/live-cash-os/components/LiveCashApp.tsx apps/live-cash-os/app/globals.css apps/live-cash-os/content/i18n/source.ru.json apps/live-cash-os/content/i18n/ru.json apps/live-cash-os/content/i18n/en.json
          git commit -m "Materialize bilingual learner runtime and translation memory"
          git pull --rebase origin agent/live-cash-os-bilingual-copy-pass
          git push origin HEAD:agent/live-cash-os-bilingual-copy-pass
