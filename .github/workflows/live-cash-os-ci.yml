name: Live Cash OS CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: live-cash-os-wave-h-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wave-h-map:
    name: Wave H failure-map snapshot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/live-cash-os
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/live-cash-os/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Capture baseline reachable RU gate
        run: node --import ./tests/register-model-loader.mjs --test --test-name-pattern="reachable RU scored corpus" tests/v4-march-wave-c-integrity.test.mjs > wave-h-baseline.log 2>&1 || true
      - name: Archive canonical content snapshot
        run: tar -czf wave-h-source.tgz content/practical-mastery tests/v4-march-wave-c-integrity.test.mjs package.json package-lock.json
      - name: Upload Wave H map packet
        uses: actions/upload-artifact@v4
        with:
          name: v4-march-wave-h-map
          path: |
            apps/live-cash-os/wave-h-baseline.log
            apps/live-cash-os/wave-h-source.tgz
          if-no-files-found: error
          retention-days: 3
