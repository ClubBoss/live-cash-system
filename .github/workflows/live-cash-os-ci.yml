name: Live Cash OS CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: live-cash-os-v4-march-wave-h-terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wave-h-export-transport:
    name: Export staged Wave H strict transport
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v4-march-wave-c-ru-corpus-firewall
      - name: Verify strict transport inventory
        working-directory: apps/live-cash-os
        run: |
          set -euo pipefail
          sha256sum .wave-h-transport/strict-*.b64 .wave-h-transport/strict4-delta.json
          wc -c .wave-h-transport/strict-*.b64 .wave-h-transport/strict4-delta.json
      - name: Upload strict transport
        uses: actions/upload-artifact@v7
        with:
          name: v4-march-wave-h-strict-transport-terminal
          path: |
            apps/live-cash-os/.wave-h-transport/strict-00.b64
            apps/live-cash-os/.wave-h-transport/strict-01.b64
            apps/live-cash-os/.wave-h-transport/strict-02.b64
            apps/live-cash-os/.wave-h-transport/strict-03.b64
            apps/live-cash-os/.wave-h-transport/strict-04.b64
            apps/live-cash-os/.wave-h-transport/strict-05.b64
            apps/live-cash-os/.wave-h-transport/strict4-delta.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3
