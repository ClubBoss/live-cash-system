name: Live Cash OS CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: live-cash-os-v4-march-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted-integration:
    name: V4 March C1 diagnostic
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/live-cash-os
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/live-cash-os/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Capture exact C1 TAP output
        run: node --import ./tests/register-model-loader.mjs --test --test-name-pattern="reachable RU scored corpus" tests/v4-march-wave-c-integrity.test.mjs > c1-diagnostic.log 2>&1 || true
      - name: Upload C1 diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: v4-march-c1-diagnostic
          path: apps/live-cash-os/c1-diagnostic.log
          if-no-files-found: error
      - name: Preserve C1 gate conclusion
        run: node --import ./tests/register-model-loader.mjs --test --test-name-pattern="reachable RU scored corpus" tests/v4-march-wave-c-integrity.test.mjs
