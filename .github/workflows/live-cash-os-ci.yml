name: Live Cash OS CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-cash-os-v6-d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted-v6-d:
    name: V6 Wave D targeted gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/live-cash-os
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/live-cash-os/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: V6-D continuity units
        run: node --import ./tests/register-model-loader.mjs --test tests/v6-wave-d-quick-start-continuity.test.mjs
      - name: Lint touched product seams
        run: npx eslint components/PracticalFirstJourneyAuthority.tsx components/PracticalFirstJourneyExperience.tsx lib/practical-continuity-workspace.ts lib/practical-profile-contract.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Quick Start targeted Chromium acceptance
        run: npx playwright test e2e/v6-quick-start-reachability.spec.mjs e2e/v4-wave-a-quick-start-authority.spec.mjs e2e/v6-wave-d-terminal-draft-continuity.spec.mjs --project=chromium
