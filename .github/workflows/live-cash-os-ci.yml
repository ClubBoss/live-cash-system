name: Live Cash OS CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: live-cash-os-v4-march-wave-h-terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wave-h-export-transport:
    name: Export Wave H transport for generator verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v4-march-wave-c-ru-corpus-firewall
      - name: Verify transport inventory
        working-directory: apps/live-cash-os
        run: |
          set -euo pipefail
          find .wave-h-transport -maxdepth 1 -type f -print | sort
          sha256sum .wave-h-transport/*
          wc -c .wave-h-transport/*
      - name: Upload full Wave H transport
        uses: actions/upload-artifact@v7
        with:
          name: v4-march-wave-h-full-transport-terminal
          path: apps/live-cash-os/.wave-h-transport
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3
