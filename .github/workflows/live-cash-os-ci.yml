name: Live Cash OS CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: live-cash-os-v4-march-wave-h-terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wave-h-transport-inspect:
    name: Wave H strict transport padding inspection
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/live-cash-os
    steps:
      - uses: actions/checkout@v7
      - name: Inspect padding and candidate streams
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, re
          root=Path('.wave-h-transport')
          for i in range(6):
              s=(root/f'strict-{i:02d}.b64').read_text().strip()
              eq=[j for j,c in enumerate(s) if c=='=']
              print(f'strict-{i:02d}: len={len(s)} mod4={len(s)%4} eq_count={len(eq)} eq_first={eq[:12]} eq_last={eq[-12:]} prefix={s[:16]!r} suffix={s[-16:]!r}')
          s=(root/'strict-00.b64').read_text().strip()
          # Locate every segment terminated by base64 padding and test it independently.
          starts=[0]
          for m in re.finditer(r'=+',s):
              end=m.end()
              seg=s[starts[-1]:end]
              compact=''.join(seg.split())
              print('SEGMENT', starts[-1], end, 'len', len(compact), 'mod4', len(compact)%4, 'prefix', compact[:12], 'suffix', compact[-12:])
              try:
                  raw=base64.b64decode(compact, validate=True)
                  print('  decoded',len(raw),'raw_prefix',raw[:8].hex())
                  if raw[:2]==b'\x1f\x8b':
                      try:
                          out=gzip.decompress(raw)
                          print('  gzip_ok bytes='+str(len(out))+' sha256='+hashlib.sha256(out).hexdigest())
                      except Exception as e:
                          print('  gzip_fail',repr(e))
              except Exception as e:
                  print('  b64_fail',repr(e))
              starts.append(end)
          if starts[-1] < len(s):
              print('TRAILING',starts[-1],len(s),'len',len(s)-starts[-1],s[starts[-1]:starts[-1]+16],s[-16:])
          PY
