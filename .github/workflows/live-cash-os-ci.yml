name: Live Cash OS CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: live-cash-os-v4-march-wave-h-terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wave-h-ru-chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v4-march-wave-c-ru-corpus-firewall
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/live-cash-os/package-lock.json
      - name: Install dependencies
        working-directory: apps/live-cash-os
        run: npm ci
      - name: Install Chromium
        working-directory: apps/live-cash-os
        run: npx playwright install --with-deps chromium
      - name: Wave C RU learner firewall runtime
        working-directory: apps/live-cash-os
        run: npx playwright test e2e/v4-march-wave-c-firewall.spec.mjs --project=chromium --grep "Wave C RU learner surfaces"
      - name: Representative RU session families
        working-directory: apps/live-cash-os
        run: npx playwright test e2e/session-render-integrity.spec.mjs --project=chromium
      - name: Practical Mastery acceptance rerun
        working-directory: apps/live-cash-os
        run: |
          npx playwright test e2e/practical-mastery-acceptance.spec.mjs --project=chromium
          echo "bounded_ru_chromium_sampling=PASS"
