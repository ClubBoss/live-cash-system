name: Live Cash OS CI

on:
  push:
    branches: [main]
    paths:
      - "apps/live-cash-os/**"
      - "learning/diagnostics/DIAGNOSTIC_RAW_RESPONSE_SCHEMA_v0_1.json"
      - ".github/workflows/live-cash-os-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/live-cash-os/**"
      - "learning/diagnostics/DIAGNOSTIC_RAW_RESPONSE_SCHEMA_v0_1.json"
      - ".github/workflows/live-cash-os-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-cash-os-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/live-cash-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/live-cash-os/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: G4 targeted E2E
        run: npx playwright test e2e/gauntlet4-real-use-learning-integrity.spec.mjs --reporter=list,github --timeout=30000
      - name: Upload G4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-targeted-evidence
          path: |
            apps/live-cash-os/playwright-report
            apps/live-cash-os/test-results
          if-no-files-found: ignore
          retention-days: 7
