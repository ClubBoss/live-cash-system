name: V7 C Real Hands Continuity Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: v7-c-real-hands-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted:
    if: github.head_ref == 'v7-preblind-c-real-hands-post-capture-continuity'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/live-cash-os
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/live-cash-os/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Bounded static and unit contracts
        run: |
          npx eslint components/Wave7Experience.tsx lib/real-hand-draft-continuity.ts tests/v7-preblind-c-real-hands-post-capture-continuity.test.mjs e2e/v7-preblind-c-real-hands-post-capture-continuity.spec.mjs
          node --check tests/v7-preblind-c-real-hands-post-capture-continuity.test.mjs
          node --check e2e/v7-preblind-c-real-hands-post-capture-continuity.spec.mjs
          node --import ./tests/register-model-loader.mjs --test tests/v7-preblind-c-real-hands-post-capture-continuity.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Bounded Chromium
        run: npx playwright test e2e/v7-preblind-c-real-hands-post-capture-continuity.spec.mjs --project=chromium
