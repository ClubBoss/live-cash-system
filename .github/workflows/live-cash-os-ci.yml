name: Live Cash OS CI

on:
  push:
    branches: [main, "wave/w7-diagnostic-field-progress"]
    paths:
      - "apps/live-cash-os/**"
      - "learning/diagnostics/DIAGNOSTIC_RAW_RESPONSE_SCHEMA_v0_1.json"
      - ".github/workflows/live-cash-os-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-cash-os-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/live-cash-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/live-cash-os/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply bounded Wave 7 runtime wiring
        if: github.ref_name == 'wave/w7-diagnostic-field-progress'
        run: node scripts/wave7-branch-apply.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Release gate
        run: npm run test:release

      - name: Commit verified Wave 7 runtime wiring
        if: success() && github.ref_name == 'wave/w7-diagnostic-field-progress'
        working-directory: .
        env:
          W7_BRANCH: ${{ github.ref_name }}
        run: |
          git fetch origin main --depth=1
          git checkout FETCH_HEAD -- .github/workflows/live-cash-os-ci.yml
          git rm apps/live-cash-os/scripts/wave7-branch-apply.mjs
          git add apps/live-cash-os/components/LiveCashAppCore.tsx apps/live-cash-os/app/globals.css .github/workflows/live-cash-os-ci.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Wave 7: wire Play Ready evidence loop"
          git push origin "HEAD:${W7_BRANCH}"

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-cash-os-playwright-evidence
          path: |
            apps/live-cash-os/playwright-report
            apps/live-cash-os/test-results
          if-no-files-found: ignore
          retention-days: 7
