name: Live Cash OS CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-cash-os-v7-d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted-v7-d:
    name: V7 D accessibility attribute gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/live-cash-os
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/live-cash-os/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Presentation firewall units
        run: node --import ./tests/register-model-loader.mjs --test tests/learner-presentation-firewall.test.mjs tests/v7-accessibility-attribute-firewall.test.mjs
      - name: Lint touched product seams
        run: npx eslint components/PracticalLearnerPresentationGuard.tsx lib/learner-accessibility-attribute-firewall.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Learner accessibility Chromium acceptance
        run: npx playwright test e2e/learner-presentation-firewall.spec.mjs e2e/v7-accessibility-attribute-firewall.spec.mjs --project=chromium
