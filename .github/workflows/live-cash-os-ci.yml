name: Live Cash OS CI

on:
  push:
    branches: [main]
    paths:
      - "apps/live-cash-os/**"
      - "learning/diagnostics/DIAGNOSTIC_RAW_RESPONSE_SCHEMA_v0_1.json"
      - ".github/workflows/live-cash-os-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/live-cash-os/**"
      - "learning/diagnostics/DIAGNOSTIC_RAW_RESPONSE_SCHEMA_v0_1.json"
      - ".github/workflows/live-cash-os-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-cash-os-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/live-cash-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/live-cash-os/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install browser matrix
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and integration gate
        run: npm test
      - name: Canonical E2E
        run: npm run test:e2e
      - name: Canonical release gate
        run: npm run test:release
      - name: G4 six-project critical matrix
        run: npx playwright test e2e/gauntlet4-real-use-learning-integrity.spec.mjs --config=playwright.cross-browser.config.mjs --reporter=list,github --timeout=30000
      - name: Current production smoke
        run: npm run smoke:production
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-cash-os-g4-final-evidence
          path: |
            apps/live-cash-os/playwright-report
            apps/live-cash-os/test-results
            apps/live-cash-os/artifacts
          if-no-files-found: ignore
          retention-days: 7
