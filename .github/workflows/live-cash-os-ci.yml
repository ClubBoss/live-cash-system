name: Live Cash OS CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: live-cash-os-v4-march-wave-h-terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wave-h-transport-inspect:
    name: Wave H strict transport corruption localization
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/live-cash-os
    steps:
      - uses: actions/checkout@v7
      - name: Localize strict-00 corruption
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, zlib
          root=Path('.wave-h-transport')
          s=(root/'strict-00.b64').read_text().strip()
          raw=base64.b64decode(s, validate=False)
          d=zlib.decompressobj(16+zlib.MAX_WBITS)
          fail=None
          out=bytearray()
          for i,b in enumerate(raw):
              try:
                  out.extend(d.decompress(bytes([b])))
              except zlib.error as e:
                  fail=(i,repr(e))
                  break
          print('permissive_decoded_bytes=',len(raw),'zlib_fail=',fail,'out_before_fail=',len(out))
          approx=0 if fail is None else max(0,(fail[0]*4)//3)
          print('approx_base64_index=',approx)
          # Try deletion candidates around the first compressed failure, then across all positions if needed.
          tail=b''.join(base64.b64decode((root/f'strict-{i:02d}.b64').read_text().strip(), validate=True) for i in range(1,6))
          def test(idx):
              c=s[:idx]+s[idx+1:]
              try: first=base64.b64decode(c, validate=True)
              except Exception: return None
              stream=first+tail
              try: data=gzip.decompress(stream)
              except Exception: return None
              return hashlib.sha256(data).hexdigest(),len(data)
          found=[]
          lo=max(0,approx-64); hi=min(len(s),approx+65)
          for idx in range(lo,hi):
              r=test(idx)
              if r: found.append((idx,s[idx],r))
          print('local_candidates=',found)
          if not found:
              for idx in range(len(s)):
                  r=test(idx)
                  if r:
                      found.append((idx,s[idx],r))
              print('global_candidates=',found)
          PY
