name: Live Cash OS CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: live-cash-os-v4-march-wave-h-terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wave-h-assemble-inspect:
    name: Wave H strict assembly inspection
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/live-cash-os
    steps:
      - uses: actions/checkout@v7
      - name: Assemble latest strict transport
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, re
          files=[Path('.wave-h-transport')/f'strict-{i:02d}.b64' for i in range(6)]
          for f in files:
              s=f.read_text()
              bad=re.findall(r'[^A-Za-z0-9+/=\r\n\t ]', s)
              print(f'{f.name}: chars={len(s)} compact={len("".join(s.split()))} bad={len(bad)} tail={repr(s[-16:])}')
          compact=''.join(''.join(f.read_text().split()) for f in files)
          print('joined_mod4=', len(compact)%4, 'joined_chars=', len(compact))
          compact += '=' * ((4-len(compact)%4)%4)
          raw=base64.b64decode(compact, validate=False)
          print('decoded_bytes=',len(raw),'prefix=',raw[:8].hex())
          out=gzip.decompress(raw)
          Path('wave-h-strict-assembled.ts').write_bytes(out)
          print('STRICT_ASSEMBLED_SHA256='+hashlib.sha256(out).hexdigest())
          print('STRICT_ASSEMBLED_BYTES='+str(len(out)))
          PY
          echo '--- HEAD ---'
          sed -n '1,40p' wave-h-strict-assembled.ts
          echo '--- TAIL ---'
          tail -40 wave-h-strict-assembled.ts
      - name: Upload assembled strict source
        uses: actions/upload-artifact@v7
        with:
          name: v4-march-wave-h-strict-assembled
          path: apps/live-cash-os/wave-h-strict-assembled.ts
          if-no-files-found: error
          retention-days: 3
