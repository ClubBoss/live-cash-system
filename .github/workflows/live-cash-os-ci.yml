name: Live Cash OS V6 Integration Targeted Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: live-cash-os-v6-integration-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  combined-targeted:
    name: V6 combined targeted gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/live-cash-os
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 9ce673584901beac5d0a973b18568855e8ad65b5
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/live-cash-os/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install bounded Chromium
        run: npx playwright install --with-deps chromium
      - name: Run exact-candidate V6 combined targeted gate
        run: |
          set -euo pipefail
          {
            echo "V6_TARGET_CANDIDATE=9ce673584901beac5d0a973b18568855e8ad65b5"
            echo "=== 1 TYPECHECK ==="
            npm run typecheck
            echo "=== 2 TARGETED UNIT STATIC CONTRACTS A D C B ==="
            node --import ./tests/register-model-loader.mjs --test \
              tests/v6-adaptive-repetition-mastery-transparency.test.mjs \
              tests/v6-wave-d-quick-start-continuity.test.mjs \
              tests/canonical-practical-integrity-repair.test.mjs \
              tests/v6-wave-c-feedback-natural-ru.test.mjs \
              tests/learner-presentation-firewall.test.mjs
            echo "=== 3 TOUCHED FILE ESLINT ==="
            npx eslint \
              components/PracticalMasteryExperience.tsx \
              components/PracticalSkillDomainOverview.tsx \
              e2e/v6-adaptive-repetition-mastery-transparency.spec.mjs \
              lib/practical-adaptive-session.ts \
              lib/practical-first-journey.ts \
              lib/practical-integrated-session.ts \
              lib/practical-repeat-window.ts \
              lib/practical-skill-transparency.ts \
              tests/v6-adaptive-repetition-mastery-transparency.test.mjs \
              components/PracticalFirstJourneyAuthority.tsx \
              components/PracticalFirstJourneyExperience.tsx \
              e2e/v6-wave-d-terminal-draft-continuity.spec.mjs \
              lib/practical-continuity-workspace.ts \
              lib/practical-profile-contract.ts \
              tests/v6-wave-d-quick-start-continuity.test.mjs \
              components/PracticalDecisionFeedback.tsx \
              content/practical-mastery/practical-decision-feedback-copy.ts \
              content/practical-mastery/practical-ru-final-polish.ts \
              e2e/v6-wave-c-feedback-natural-ru.spec.mjs \
              tests/canonical-practical-integrity-repair.test.mjs \
              tests/v6-wave-c-feedback-natural-ru.test.mjs \
              components/PracticalLearnerPresentationGuard.tsx \
              components/SupportingToolsApp.tsx \
              e2e/learner-presentation-firewall.spec.mjs \
              lib/learner-presentation-firewall.ts \
              tests/learner-presentation-firewall.test.mjs
            echo "=== 4 BOUNDED CHROMIUM A D C B ==="
            npx playwright test \
              e2e/v6-adaptive-repetition-mastery-transparency.spec.mjs \
              e2e/v6-wave-d-terminal-draft-continuity.spec.mjs \
              e2e/v6-wave-c-feedback-natural-ru.spec.mjs \
              e2e/learner-presentation-firewall.spec.mjs \
              --project=chromium
            echo "V6_COMBINED_TARGETED_GATE=GREEN"
          } 2>&1 | tee v6-combined-targeted-gate.log
      - name: Upload targeted gate log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v6-combined-targeted-gate
          path: apps/live-cash-os/v6-combined-targeted-gate.log
          if-no-files-found: error
          retention-days: 7
