name: V7 Post-Blind C Pre-Answer Continuity

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  targeted:
    if: github.head_ref == 'v7-postblind-c-preanswer-round-continuity'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/live-cash-os
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/live-cash-os/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Materialize bounded product candidate
        run: python scripts/v7-postblind-c-materialize.py
      - name: Typecheck
        run: npm run typecheck
      - name: Static and unit contracts
        run: |
          npx eslint components/PracticalIntegratedSessionExperience.tsx lib/practical-continuity-workspace.ts tests/v7-postblind-c-preanswer-round-continuity.test.mjs e2e/v7-postblind-c-preanswer-round-continuity.spec.mjs
          node --check tests/v7-postblind-c-preanswer-round-continuity.test.mjs
          node --check e2e/v7-postblind-c-preanswer-round-continuity.spec.mjs
          node --import ./tests/register-model-loader.mjs --test tests/v7-postblind-c-preanswer-round-continuity.test.mjs tests/v3-continuity-workspace.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Chromium continuity proof
        run: npx playwright test e2e/v7-postblind-c-preanswer-round-continuity.spec.mjs --project=chromium
      - name: Commit validated product authority
        run: |
          git config user.name "ClubBoss"
          git config user.email "esalimzade@hotmail.com"
          git add components/PracticalIntegratedSessionExperience.tsx lib/practical-continuity-workspace.ts
          if ! git diff --cached --quiet; then
            git commit -m "V7 Post-Blind C: persist active round before first answer [skip ci]"
            git push origin HEAD:v7-postblind-c-preanswer-round-continuity
          fi
