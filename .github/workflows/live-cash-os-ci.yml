name: Live Cash OS CI

on:
  push:
    branches: [main, wave/w8-premium-ux-accessibility]
    paths:
      - "apps/live-cash-os/**"
      - "learning/diagnostics/DIAGNOSTIC_RAW_RESPONSE_SCHEMA_v0_1.json"
      - ".github/workflows/live-cash-os-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-cash-os-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/live-cash-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/live-cash-os/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Wave 8 browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Release gate
        run: npm run test:release

      - name: Wave 8 cross-browser smoke
        run: npx playwright test wave8-ux.spec.mjs --config=playwright.cross-browser.config.mjs

      - name: Upload Wave 8 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-cash-os-w8-browser-evidence
          path: |
            apps/live-cash-os/playwright-report
            apps/live-cash-os/test-results
          if-no-files-found: ignore
          retention-days: 7
