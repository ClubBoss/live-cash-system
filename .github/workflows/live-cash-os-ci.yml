name: V4 Wave D Targeted Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: v4-wave-d-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted-wave-d:
    name: Targeted Wave D continuity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/live-cash-os
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/live-cash-os/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck Wave D product seam
        run: npm run typecheck
      - name: Run targeted continuity unit cases
        run: node --import ./tests/register-model-loader.mjs --test --test-name-pattern="V4-D" tests/v3-continuity-workspace.test.mjs
      - name: Lint touched Wave D seams
        run: npx eslint components/PracticalMasteryExperience.tsx components/PracticalPerceptualExperience.tsx components/PracticalIntegratedSessionExperience.tsx lib/practical-continuity-workspace.ts lib/practical-profile-contract.ts tests/v3-continuity-workspace.test.mjs e2e/v4-wave-d-continuity-focus.spec.mjs e2e/v4-wave-d-skill-map-continuity.spec.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run targeted Wave D browser cases
        run: npx playwright test e2e/v4-wave-d-continuity-focus.spec.mjs e2e/v4-wave-d-skill-map-continuity.spec.mjs --project=chromium
