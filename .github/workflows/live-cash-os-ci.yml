name: Live Cash OS V7 Combined Targeted Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: v7-preblind-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  combined-targeted:
    name: V7 A+B+C+D combined targeted gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/live-cash-os
    steps:
      - name: Checkout exact integration candidate
        uses: actions/checkout@v7
        with:
          ref: bce2dc9a5db916f234ce12a6fd830ef24225f34a
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/live-cash-os/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Touched-file ESLint
        run: >-
          npx eslint
          components/PracticalIntegratedSessionExperience.tsx
          e2e/v7-preblind-empty-practice.spec.mjs
          lib/practical-integrated-session-state.ts
          lib/practical-integrated-session.ts
          tests/v7-preblind-repair-empty-practice.test.mjs
          content/practical-mastery/practical-decision-feedback-copy.ts
          e2e/v7-b3-changed-node-causal-feedback.spec.mjs
          tests/v7-b3-changed-node-causal-feedback.test.mjs
          components/Wave7Experience.tsx
          e2e/v7-preblind-c-real-hands-post-capture-continuity.spec.mjs
          lib/real-hand-draft-continuity.ts
          tests/v7-preblind-c-real-hands-post-capture-continuity.test.mjs
          components/PracticalLearnerPresentationGuard.tsx
          e2e/v7-accessibility-attribute-firewall.spec.mjs
          lib/learner-accessibility-attribute-firewall.ts
          tests/v7-accessibility-attribute-firewall.test.mjs
          tests/canonical-practical-integrity-repair.test.mjs
      - name: Targeted governance and editorial static checks
        run: npm run check:governance && npm run check:editorial
      - name: Targeted A+B+C+D unit contracts
        run: >-
          node --import ./tests/register-model-loader.mjs --test
          tests/canonical-practical-integrity-repair.test.mjs
          tests/final-comprehension-closure.test.mjs
          tests/v7-preblind-repair-empty-practice.test.mjs
          tests/v7-b3-changed-node-causal-feedback.test.mjs
          tests/v7-preblind-c-real-hands-post-capture-continuity.test.mjs
          tests/v7-accessibility-attribute-firewall.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Bounded Chromium A+B+C+D
        run: >-
          npx playwright test
          e2e/v7-preblind-empty-practice.spec.mjs
          e2e/v7-b3-changed-node-causal-feedback.spec.mjs
          e2e/v7-preblind-c-real-hands-post-capture-continuity.spec.mjs
          e2e/v7-accessibility-attribute-firewall.spec.mjs
          --project=chromium
