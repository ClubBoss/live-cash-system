name: V7 C Real Hands Continuity Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: v7-c-real-hands-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted:
    if: github.head_ref == 'v7-preblind-c-real-hands-post-capture-continuity'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/live-cash-os
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/live-cash-os/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Materialize bounded Wave7 wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/Wave7Experience.tsx')
          text = path.read_text()

          old_import = '''import {
            REAL_HAND_DRAFT_KEY,
            clearUiStorage,
            readProfileScopedUiValue,
            writeProfileScopedUiValue,
          } from "../lib/ui-session-storage";'''
          new_import = '''import {
            clearAcknowledgedRealHandPostCaptureDraft,
            clearRealHandCapture,
            emptyRealHandCapture,
            isRealHandDraftMutationAcknowledged,
            patchRealHandBindingInput,
            patchRealHandCapture,
            patchRealHandPostCaptureText,
            patchRealHandReviewerKind,
            persistRealHandDraftWorkspace,
            readRealHandDraftWorkspace,
            type PendingRealHandDraftMutation,
            type RealHandDraftWorkspace,
          } from "../lib/real-hand-draft-continuity";'''
          if old_import not in text:
            raise SystemExit('ui-session-storage import seam not found')
          text = text.replace(old_import, new_import, 1)

          start = text.index('const REAL_HAND_DRAFT_TTL_MS')
          end = text.index('function copy(locale')
          replacement = '''const REQUIRED_HAND_FIELDS = [
            "stakes",
            "heroPosition",
            "villainPositions",
            "effectiveStacks",
            "straddle",
            "actionSequence",
            "board",
            "sizings",
            "cue",
            "action",
            "reason",
          ] as const satisfies readonly (keyof FieldHandInput)[];

          type PendingFieldSave = {
            revision: number;
            updatedAt: string;
            noteId: string;
            previousLocalSaveAt: string | null;
          };

          '''
          text = text[:start] + replacement + text[end:]

          old_states = '''  const [hand, setHand] = useState<FieldHandInput>(() => readRealHandDraft());
            const [pendingSave, setPendingSave] = useState<PendingFieldSave | null>(null);
            const [reviewNotes, setReviewNotes] = useState<Record<string, string>>({});
            const [reviewerKinds, setReviewerKinds] = useState<Record<string, FieldReviewerKind>>({});
            const [bindingInputs, setBindingInputs] = useState<Record<string, PracticalFieldBindingInput>>({});
            const [resultDrafts, setResultDrafts] = useState<Record<string, string>>({});
            const [showdownDrafts, setShowdownDrafts] = useState<Record<string, string>>({});
            const [explainNotes, setExplainNotes] = useState<Record<string, string>>({});'''
          new_states = '''  const [draftWorkspace, setDraftWorkspace] = useState<RealHandDraftWorkspace>(() => readRealHandDraftWorkspace(state));
            const hand = draftWorkspace.capture;
            const reviewNotes = draftWorkspace.postCapture.reviewNoteByNoteId;
            const reviewerKinds = draftWorkspace.postCapture.reviewerKindByNoteId;
            const bindingInputs = draftWorkspace.postCapture.practicalBindingByNoteId;
            const resultDrafts = draftWorkspace.postCapture.resultByNoteId;
            const showdownDrafts = draftWorkspace.postCapture.showdownByNoteId;
            const explainNotes = draftWorkspace.postCapture.explainReviewByRecordId;
            const [pendingSave, setPendingSave] = useState<PendingFieldSave | null>(null);
            const [pendingDraftSaves, setPendingDraftSaves] = useState<PendingRealHandDraftMutation[]>([]);'''
          if old_states not in text:
            raise SystemExit('component-local draft state seam not found')
          text = text.replace(old_states, new_states, 1)

          old_ack = '''    clearUiStorage(REAL_HAND_DRAFT_KEY);
              setHand(emptyHand());
              setPendingSave(null);
            }, [lastLocalSaveAt, pendingSave, state.fieldNotes, state.revision]);

            function patch<K extends keyof FieldHandInput>(key: K, value: FieldHandInput[K]) {
              const next = { ...hand, [key]: value };
              setHand(next);
              persistRealHandDraft(next);
            }

            function clearDraft() {
              if (pendingSave) return;
              clearUiStorage(REAL_HAND_DRAFT_KEY);
              setHand(emptyHand());
            }

            function save() {
              if (errors.length || pendingSave) return;
              if (!persistRealHandDraft(hand)) return;'''
          new_ack = '''    setDraftWorkspace((current) => {
              const next = clearRealHandCapture(current);
              persistRealHandDraftWorkspace(next);
              return next;
            });
              setPendingSave(null);
            }, [lastLocalSaveAt, pendingSave, state.fieldNotes, state.revision]);

            useEffect(() => {
              if (!pendingDraftSaves.length || !lastLocalSaveAt) return;
              const acknowledged = pendingDraftSaves.filter((pending) => isRealHandDraftMutationAcknowledged(state, pending, lastLocalSaveAt));
              if (!acknowledged.length) return;
              const keys = new Set(acknowledged.map((pending) => `${pending.kind}:${pending.identity}:${pending.revision}`));
              setDraftWorkspace((current) => {
                let next = current;
                for (const pending of acknowledged) next = clearAcknowledgedRealHandPostCaptureDraft(next, pending);
                persistRealHandDraftWorkspace(next);
                return next;
              });
              setPendingDraftSaves((current) => current.filter((pending) => !keys.has(`${pending.kind}:${pending.identity}:${pending.revision}`)));
            }, [lastLocalSaveAt, pendingDraftSaves, state]);

            function updateDraftWorkspace(transform: (current: RealHandDraftWorkspace) => RealHandDraftWorkspace) {
              setDraftWorkspace((current) => {
                const next = transform(current);
                persistRealHandDraftWorkspace(next);
                return next;
              });
            }

            function patch<K extends keyof FieldHandInput>(key: K, value: FieldHandInput[K]) {
              updateDraftWorkspace((current) => patchRealHandCapture(current, { [key]: value } as Partial<FieldHandInput>));
            }

            function clearDraft() {
              if (pendingSave) return;
              updateDraftWorkspace(clearRealHandCapture);
            }

            function save() {
              if (errors.length || pendingSave) return;
              if (!persistRealHandDraftWorkspace(draftWorkspace)) return;'''
          if old_ack not in text:
            raise SystemExit('durability ack/capture seam not found')
          text = text.replace(old_ack, new_ack, 1)

          start = text.index('  function reviewHand(noteId: string, outcome: FieldReviewOutcome)')
          end = text.index('  function reviewerLabel(note: StructuredFieldNote)')
          handlers = '''  function queuePendingDraftSave(pending: PendingRealHandDraftMutation) {
            setPendingDraftSaves((current) => [
              ...current.filter((item) => !(item.kind === pending.kind && item.identity === pending.identity)),
              pending,
            ]);
          }

          function addResultForNote(noteId: string) {
            const result = resultDrafts[noteId] ?? "";
            const showdown = showdownDrafts[noteId] ?? "";
            if (!result.trim() || !persistRealHandDraftWorkspace(draftWorkspace)) return;
            const next = addFieldResult(state, noteId, result, showdown);
            if (next === state) return;
            const nextNote = (next.fieldNotes as StructuredFieldNote[]).find((note) => note.id === noteId);
            if (!nextNote?.resultAddedAt) return;
            queuePendingDraftSave({
              kind: "RESULT",
              identity: noteId,
              revision: next.revision,
              updatedAt: next.updatedAt,
              previousLocalSaveAt: lastLocalSaveAt,
              result,
              showdown,
            });
            setState(next);
          }

          function reviewHand(noteId: string, outcome: FieldReviewOutcome) {
            const text = reviewNotes[noteId] ?? "";
            const reviewerKind = reviewerKinds[noteId] ?? "SELF";
            if (!text.trim()) return;
            const input = bindingInputs[noteId];
            const resolved = reviewerKind === "SELF" ? null : resolvePracticalFieldBinding(noteId, reviewerKind, input);
            if ((outcome === "REPAIR_REQUIRED" || outcome === "SUPPORTS_TRANSFER") && reviewerKind !== "SELF" && !resolved) return;
            if (!persistRealHandDraftWorkspace(draftWorkspace)) return;
            const next = reviewFieldHand(state, noteId, outcome, text, reviewerKind, resolved ? input : undefined);
            if (next === state) return;
            const nextNote = (next.fieldNotes as StructuredFieldNote[]).find((note) => note.id === noteId);
            if (!nextNote?.reviewedAt) return;
            queuePendingDraftSave({
              kind: "REVIEW",
              identity: noteId,
              revision: next.revision,
              updatedAt: next.updatedAt,
              previousLocalSaveAt: lastLocalSaveAt,
              reviewerKind,
              reviewerNote: text,
              reviewedAt: nextNote.reviewedAt,
            });
            setState(next);
          }

          function reviewExplainRecord(recordId: string, status: "REVIEWED_OK" | "REVIEWED_REPAIR" | "INSUFFICIENT") {
            const text = explainNotes[recordId] ?? "";
            if (!text.trim() || !persistRealHandDraftWorkspace(draftWorkspace)) return;
            const next = reviewExplainBack(state, recordId, status, text);
            if (next === state) return;
            const record = explainBackRecords(next).find((row) => row.id === recordId);
            if (!record?.reviewedAt) return;
            queuePendingDraftSave({
              kind: "EXPLAIN_REVIEW",
              identity: recordId,
              revision: next.revision,
              updatedAt: next.updatedAt,
              previousLocalSaveAt: lastLocalSaveAt,
              status,
              reviewerNote: text,
              reviewedAt: record.reviewedAt,
            });
            setState(next);
          }

          '''
          text = text[:start] + handlers + text[end:]

          replacements = {
            'onChange={(event) => setExplainNotes((current) => ({ ...current, [record.id]: event.target.value }))}': 'onChange={(event) => updateDraftWorkspace((current) => patchRealHandPostCaptureText(current, "explainReviewByRecordId", record.id, event.target.value))}',
            'onClick={() => setState(reviewExplainBack(state, record.id, "INSUFFICIENT", reviewText))}': 'onClick={() => reviewExplainRecord(record.id, "INSUFFICIENT")}',
            'onClick={() => setState(reviewExplainBack(state, record.id, "REVIEWED_REPAIR", reviewText))}': 'onClick={() => reviewExplainRecord(record.id, "REVIEWED_REPAIR")}',
            'onClick={() => setState(reviewExplainBack(state, record.id, "REVIEWED_OK", reviewText))}': 'onClick={() => reviewExplainRecord(record.id, "REVIEWED_OK")}',
            'onChange={(event) => setResultDrafts((current) => ({ ...current, [note.id]: event.target.value }))}': 'onChange={(event) => updateDraftWorkspace((current) => patchRealHandPostCaptureText(current, "resultByNoteId", note.id, event.target.value))}',
            'onChange={(event) => setShowdownDrafts((current) => ({ ...current, [note.id]: event.target.value }))}': 'onChange={(event) => updateDraftWorkspace((current) => patchRealHandPostCaptureText(current, "showdownByNoteId", note.id, event.target.value))}',
            'onClick={() => setState(addFieldResult(state, note.id, resultText, showdownText))}': 'onClick={() => addResultForNote(note.id)}',
            'onChange={(event) => setReviewerKinds((current) => ({ ...current, [note.id]: event.target.value as FieldReviewerKind }))}': 'onChange={(event) => updateDraftWorkspace((current) => patchRealHandReviewerKind(current, note.id, event.target.value as FieldReviewerKind))}',
            'onChange={(value) => setBindingInputs((current) => ({ ...current, [note.id]: value }))}': 'onChange={(value) => updateDraftWorkspace((current) => patchRealHandBindingInput(current, note.id, value))}',
            'onChange={(event) => setReviewNotes((current) => ({ ...current, [note.id]: event.target.value }))}': 'onChange={(event) => updateDraftWorkspace((current) => patchRealHandPostCaptureText(current, "reviewNoteByNoteId", note.id, event.target.value))}',
          }
          for old, new in replacements.items():
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'expected exactly one UI seam for {old[:40]!r}, got {count}')
            text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Typecheck
        run: npm run typecheck
      - name: Bounded static contracts
        run: |
          npx eslint components/Wave7Experience.tsx lib/real-hand-draft-continuity.ts tests/v7-preblind-c-real-hands-post-capture-continuity.test.mjs e2e/v7-preblind-c-real-hands-post-capture-continuity.spec.mjs
          node --check tests/v7-preblind-c-real-hands-post-capture-continuity.test.mjs
          node --check e2e/v7-preblind-c-real-hands-post-capture-continuity.spec.mjs
          node --import ./tests/register-model-loader.mjs --test tests/v7-preblind-c-real-hands-post-capture-continuity.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Bounded Chromium
        run: npx playwright test e2e/v7-preblind-c-real-hands-post-capture-continuity.spec.mjs --project=chromium
      - name: Commit validated product wiring
        run: |
          git config user.name "ClubBoss"
          git config user.email "esalimzade@hotmail.com"
          git add apps/live-cash-os/components/Wave7Experience.tsx
          if ! git diff --cached --quiet; then
            git commit -m "V7 C: persist Real Hands post-capture drafts [skip ci]"
            git push origin HEAD:v7-preblind-c-real-hands-post-capture-continuity
          fi
