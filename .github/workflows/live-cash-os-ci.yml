name: Live Cash OS CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: live-cash-os-v4-march-wave-h-terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wave-h-inspect-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reconstruct and inspect strict publication source
        working-directory: apps/live-cash-os
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,json
          d=Path('.wave-h-transport')
          s=d.joinpath('strict-00.b64').read_text().strip()[:18000]
          for i in range(1,6): s += d.joinpath(f'strict-{i:02d}.b64').read_text().strip()
          raw=gzip.decompress(base64.b64decode(s)).decode()
          print('bytes',len(raw.encode()))
          print('sha256',hashlib.sha256(raw.encode()).hexdigest())
          print('---HEAD---')
          print('\n'.join(raw.splitlines()[:12]))
          print('---TAIL---')
          print('\n'.join(raw.splitlines()[-12:]))
          delta=json.loads(d.joinpath('strict4-delta.json').read_text())
          print('delta_type',type(delta).__name__,'delta_len',len(delta))
          print('delta_sample',list(delta.items())[:2] if isinstance(delta,dict) else delta[:2])
          PY
