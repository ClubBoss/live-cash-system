name: Live Cash OS CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: live-cash-os-v4-march-wave-h-terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wave-h-export-checkout:
    name: Export Wave H branch checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v4-march-wave-c-ru-corpus-firewall
          fetch-depth: 0
      - name: Record branch truth
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git rev-parse origin/main
          git log --oneline -30
      - name: Pack checkout
        run: tar --exclude=.git -czf /tmp/live-cash-wave-h-checkout.tgz .
      - name: Upload checkout
        uses: actions/upload-artifact@v7
        with:
          name: v4-march-wave-h-checkout-terminal
          path: /tmp/live-cash-wave-h-checkout.tgz
          if-no-files-found: error
          retention-days: 3
