name: Live Cash OS CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: live-cash-os-v4-march-wave-h-terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wave-h-assemble-inspect:
    name: Wave H strict assembly inspection
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/live-cash-os
    steps:
      - uses: actions/checkout@v7
      - name: Assemble latest strict transport
        run: |
          set -euo pipefail
          {
            for f in \
              .wave-h-transport/strict-00.b64 \
              .wave-h-transport/strict-01.b64 \
              .wave-h-transport/strict-02.b64 \
              .wave-h-transport/strict-03.b64 \
              .wave-h-transport/strict-04.b64 \
              .wave-h-transport/strict-05.b64; do
              base64 --decode "$f"
            done
          } | gzip -dc > wave-h-strict-assembled.ts
          echo "STRICT_ASSEMBLED_SHA256=$(sha256sum wave-h-strict-assembled.ts | awk '{print $1}')"
          echo "STRICT_ASSEMBLED_BYTES=$(wc -c < wave-h-strict-assembled.ts)"
          echo '--- HEAD ---'
          sed -n '1,40p' wave-h-strict-assembled.ts
          echo '--- TAIL ---'
          tail -40 wave-h-strict-assembled.ts
      - name: Upload assembled strict source
        uses: actions/upload-artifact@v7
        with:
          name: v4-march-wave-h-strict-assembled
          path: apps/live-cash-os/wave-h-strict-assembled.ts
          if-no-files-found: error
          retention-days: 3
