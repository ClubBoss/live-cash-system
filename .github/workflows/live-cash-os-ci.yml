name: Live Cash OS CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: live-cash-os-v4-march-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted-integration:
    name: V4 March targeted integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/live-cash-os
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/live-cash-os/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Targeted unit and static suites
        run: >-
          node --import ./tests/register-model-loader.mjs --test
          tests/practical-first-journey-authority.test.mjs
          tests/practical-visible-change-integrity.test.mjs
          tests/v4-march-wave-c-integrity.test.mjs
          tests/practical-learner-surface-clarity.test.mjs
          tests/v3-continuity-workspace.test.mjs
      - name: ESLint touched March seams
        run: >-
          npx eslint
          components/PracticalFirstJourneyAuthority.tsx
          components/PracticalFirstJourneyExperience.tsx
          components/BuildIdentityFooter.tsx
          components/PracticalLearnerPresentationGuard.tsx
          components/PracticalMasteryExperience.tsx
          components/PracticalStudyLoopExperience.tsx
          components/PracticalIntegratedSessionExperience.tsx
          components/PracticalPerceptualExperience.tsx
          content/practical-mastery/decisions-variation-b3.ts
          content/practical-mastery/source-gaps.ts
          content/practical-mastery/study-loop-c1.ts
          lib/practical-visible-scenario.ts
          lib/practical-continuity-workspace.ts
          lib/practical-profile-contract.ts
          tests/practical-first-journey-authority.test.mjs
          tests/practical-visible-change-integrity.test.mjs
          tests/v4-march-wave-c-integrity.test.mjs
          tests/practical-learner-surface-clarity.test.mjs
          tests/v3-continuity-workspace.test.mjs
          e2e/v4-wave-a-quick-start-authority.spec.mjs
          e2e/practical-visible-change-integrity.spec.mjs
          e2e/v4-march-wave-c-firewall.spec.mjs
          e2e/v4-wave-d-continuity-focus.spec.mjs
          e2e/v4-wave-d-skill-map-continuity.spec.mjs
          e2e/v3-continuity-workspace.spec.mjs
          e2e/practical-mastery-acceptance.spec.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Targeted Chromium integration
        run: >-
          npx playwright test
          e2e/v4-wave-a-quick-start-authority.spec.mjs
          e2e/practical-visible-change-integrity.spec.mjs
          e2e/v4-march-wave-c-firewall.spec.mjs
          e2e/v4-wave-d-continuity-focus.spec.mjs
          e2e/v4-wave-d-skill-map-continuity.spec.mjs
          e2e/v3-continuity-workspace.spec.mjs
          e2e/practical-mastery-acceptance.spec.mjs
          --project=chromium
