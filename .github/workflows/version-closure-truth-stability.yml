name: Version Closure Truth Stability

on:
  push:
    branches:
      - release/v1.2.0-post-tester-closure

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v1.2.0-post-tester-closure
          fetch-depth: 0
      - name: Make repository truth stable across merge and tag
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise RuntimeError(f'{path}: expected one match, got {text.count(old)} for {old!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          state = Path('state/CURRENT_PROJECT_STATE.yaml')
          replace_once(state, '  phase: post_tester_abc_complete_v1_2_candidate_feature_freeze', '  phase: post_tester_abc_complete_v1_2_feature_freeze_real_use_ready')
          replace_once(state, '  version_1_2_0_status: CANDIDATE_NOT_MERGED_NOT_TAGGED', '  version_1_2_0_status: APP_VERSION_SET_TAG_IDENTITY_FROM_GIT')
          replace_once(state, '  name: v1_2_0_candidate_real_use_validation_ready', '  name: real_use_validation_ready')
          replace_once(state, '- version 1.2.0 candidate is not tagged or deployed until exact-main post-merge gates pass', '- v1.2.0 tag may identify only an exact-main commit after CI, test-mirror deploy and smoke pass; tag presence is authoritative from Git refs')

          release = Path('apps/live-cash-os/RELEASE_STATUS.md')
          replace_once(release,
              'Status: `POST_TESTER_A_B_C_IMPLEMENTATION_COMPLETE / VERSION_1_2_0_CANDIDATE / FEATURE_FREEZE / HUMAN_CONTENT_LANGUAGE_REVIEW_PENDING / W10_PENDING`',
              'Status: `POST_TESTER_A_B_C_IMPLEMENTATION_COMPLETE / APP_VERSION_1_2_0 / FEATURE_FREEZE / HUMAN_CONTENT_LANGUAGE_REVIEW_PENDING / W10_PENDING`')
          replace_once(release,
              'Final Red-Team, Gauntlets 1–4 and Post-Tester Waves A/B/C are integrated implementation history. The `1.2.0` version in this branch is a release candidate only; it does not create human approval, W10 evidence, a Git tag, test-mirror deployment proof for this candidate, or stable-production publication.',
              'Final Red-Team, Gauntlets 1–4 and Post-Tester Waves A/B/C are integrated implementation history. App version `1.2.0` labels the A/B/C implementation checkpoint; this label does not create human approval, W10 evidence or stable-production publication. Whether tag `v1.2.0` exists and which commit it identifies is authoritative from Git refs; tag creation is allowed only after exact-main CI, test-mirror deploy and live smoke pass.')
          replace_once(release, '## v1.2.0 post-tester candidate', '## v1.2.0 post-tester checkpoint')
          replace_once(release,
              '`v1.2.0` tag: **NOT CREATED** in the candidate branch.',
              '`v1.2.0` tag identity: **consult Git refs**; policy requires exact-main CI, test-mirror deploy and live smoke before creation.')

          ledger = Path('apps/live-cash-os/ACCEPTANCE_LEDGER.md')
          replace_once(ledger,
              'Status: `POST_TESTER_A_B_C_IMPLEMENTATION_COMPLETE / VERSION_1_2_0_CANDIDATE / FEATURE_FREEZE / HUMAN_CONTENT_LANGUAGE_REVIEW_PENDING / W10_PENDING`',
              'Status: `POST_TESTER_A_B_C_IMPLEMENTATION_COMPLETE / APP_VERSION_1_2_0 / FEATURE_FREEZE / HUMAN_CONTENT_LANGUAGE_REVIEW_PENDING / W10_PENDING`')
          replace_once(ledger,
              'Post-Tester Waves A/B/C are accepted and integrated implementation work. The `1.2.0` version in this branch is only a candidate checkpoint; it does not satisfy human review, W10 or W11. Feature freeze now rejects unsupported synthetic feature work by default: reopening requires empirical real-use evidence or an independently verified P0/P1 defect.',
              'Post-Tester Waves A/B/C are accepted and integrated implementation work. App version `1.2.0` labels this implementation checkpoint; tag presence and identity remain authoritative from Git refs and do not satisfy human review, W10 or W11. Feature freeze rejects unsupported synthetic feature work by default: reopening requires empirical real-use evidence or an independently verified P0/P1 defect.')
          PY
          git diff --check
      - name: Commit stable truth without workflow
        shell: bash
        run: |
          rm .github/workflows/version-closure-truth-stability.yml
          git diff --check
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: make v1.2.0 truth stable across tag creation"
          git push origin HEAD:release/v1.2.0-post-tester-closure
