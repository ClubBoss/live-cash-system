name: Version Closure Bootstrap

on:
  push:
    branches:
      - release/v1.2.0-post-tester-closure

permissions:
  contents: write

jobs:
  apply-version-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v1.2.0-post-tester-closure
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/live-cash-os/package-lock.json
      - name: Apply bounded version closure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          repo = Path('.')
          app = repo / 'apps/live-cash-os'

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one {old!r}, got {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          def insert_after_once(path, marker, insertion):
              text = path.read_text(encoding='utf-8')
              count = text.count(marker)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one marker {marker!r}, got {count}')
              path.write_text(text.replace(marker, marker + insertion, 1), encoding='utf-8')

          def write_json(path, value):
              path.write_text(json.dumps(value, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # Version metadata only; dependency graph stays byte-logically identical.
          package_path = app / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          if package.get('version') != '1.1.0':
              raise RuntimeError(f'unexpected package version {package.get("version")}')
          package['version'] = '1.2.0'
          write_json(package_path, package)

          lock_path = app / 'package-lock.json'
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          if lock.get('version') != '1.0.0' or lock.get('packages', {}).get('', {}).get('version') != '1.0.0':
              raise RuntimeError('unexpected package-lock root metadata')
          lock['version'] = '1.2.0'
          lock['packages']['']['version'] = '1.2.0'
          write_json(lock_path, lock)

          model_core = app / 'lib/model-core.ts'
          replace_once(model_core, 'export const APP_VERSION = "1.1.0";', 'export const APP_VERSION = "1.2.0";')
          model_text = model_core.read_text(encoding='utf-8')
          if 'export const STATE_SCHEMA_VERSION = 2;' not in model_text:
              raise RuntimeError('schema version changed')
          if 'export const CONTENT_VERSION = "2026.08-wave7-integrity";' not in model_text:
              raise RuntimeError('content version changed')

          shell = app / 'components/LiveCashApp.tsx'
          replace_once(shell,
              'import { runtimeCopy } from "../content/i18n/runtime";\nimport LiveCashAppCore from "./LiveCashAppCore";',
              'import { runtimeCopy } from "../content/i18n/runtime";\nimport { APP_VERSION } from "../lib/model";\nimport LiveCashAppCore from "./LiveCashAppCore";')
          replace_once(shell,
              '      data-build-sha={rawBuildSha}\n      aria-label={`Build ${buildLabel}`}',
              '      data-build-sha={rawBuildSha}\n      data-app-version={APP_VERSION}\n      aria-label={`Live Cash OS v${APP_VERSION} · Build ${buildLabel}`}')
          replace_once(shell, '      Build {buildLabel}\n', '      Live Cash OS v{APP_VERSION} · Build {buildLabel}\n')

          # Existing version-specific tests must follow canonical APP_VERSION.
          replace_once(app / 'tests/kernel-content.test.mjs',
              '  assert.equal(migrated.appVersion, "1.1.0");',
              '  assert.equal(migrated.appVersion, "1.2.0");')
          replace_once(app / 'tests/post-tester-access-mobile.test.mjs',
              '  assert.equal(packageJson.version, "1.1.0");',
              '  assert.equal(packageJson.version, "1.2.0");')

          start = repo / 'START_HERE.md'
          replace_once(start,
              'Status: `POST_INTEGRATION_INTEGRITY_HARDENED / HUMAN_CONTENT_LANGUAGE_REVIEW_PENDING / TEST_MIRROR_AUTHORIZED`',
              'Status: `POST_TESTER_A_B_C_IMPLEMENTATION_COMPLETE / VERSION_1_2_0_CANDIDATE / FEATURE_FREEZE / HUMAN_CONTENT_LANGUAGE_REVIEW_PENDING / TEST_MIRROR_AUTHORIZED`')
          insert_after_once(start,
              '- post-integration integrity hardening covers verified Cards, Review, Before Play, Real Hands, recovery, browser-gate and release-path gaps;\n',
              '- Post-Tester Waves A/B/C are implementation-complete and integrated; the `1.2.0` version in this branch remains a candidate until evaluator acceptance, merge, exact-main CI, test-mirror deploy and smoke;\n- feature freeze is active: further product changes require empirical real-use evidence or an independently verified P0/P1 defect;\n')
          replace_once(start,
              '`POST_INTEGRATION_INTEGRITY_HARDENING -> HUMAN_CONTENT_LANGUAGE_REVIEW -> W10_EMPIRICAL_VALIDATION -> W11_RELEASE_ACCEPTANCE`',
              '`V1_2_0_CANDIDATE -> REAL_USE_VALIDATION -> W10_EMPIRICAL_VALIDATION -> W11_RELEASE_ACCEPTANCE`')
          insert_after_once(start, '- change the stable URL;\n',
              '- open a new synthetic product/UX feature wave without empirical real-use evidence or an independently verified P0/P1 defect;\n')
          insert_after_once(start, '`REPO_STATE_OVERRIDES_CHAT_MEMORY`\n',
              '\n`IMPLEMENTATION_COMPLETE_FOR_REAL_USE_VALIDATION / FEATURE_FREEZE`\n')

          state_path = repo / 'state/CURRENT_PROJECT_STATE.yaml'
          replace_once(state_path, '  phase: post_integration_integrity_hardened_human_review_pending', '  phase: post_tester_abc_complete_v1_2_candidate_feature_freeze')
          replace_once(state_path, "  updated_at: '2026-08-09T18:50:00+04:00'", "  updated_at: '2026-08-10T14:15:00+04:00'")
          replace_once(state_path, '  app_version: 1.1.0', '  app_version: 1.2.0')
          insert_after_once(state_path, '  post_integration_integrity_status: INTEGRATED\n',
              '  post_tester_abc_status: IMPLEMENTATION_COMPLETE\n  version_1_2_0_status: CANDIDATE_NOT_MERGED_NOT_TAGGED\n  feature_freeze: true\n')
          replace_once(state_path, '  name: post_integration_integrity_hardened_human_review_pending', '  name: v1_2_0_candidate_real_use_validation_ready')
          insert_after_once(state_path, 'truth_boundaries:\n',
              '- implementation-complete for real-use validation is not empirical validation\n- version 1.2.0 candidate is not tagged or deployed until exact-main post-merge gates pass\n- further product changes require empirical real-use evidence or an independently verified P0/P1 defect\n')

          release = app / 'RELEASE_STATUS.md'
          replace_once(release,
              'Status: `POST_INTEGRATION_INTEGRITY_HARDENED / HUMAN_CONTENT_LANGUAGE_REVIEW_PENDING / W10_PENDING`',
              'Status: `POST_TESTER_A_B_C_IMPLEMENTATION_COMPLETE / VERSION_1_2_0_CANDIDATE / FEATURE_FREEZE / HUMAN_CONTENT_LANGUAGE_REVIEW_PENDING / W10_PENDING`')
          replace_once(release,
              'Final Red-Team and Gauntlets 1–4 are integrated implementation history. The post-integration integrity closure hardens verified real-use and release gaps without creating human approval or W10 evidence.',
              'Final Red-Team, Gauntlets 1–4 and Post-Tester Waves A/B/C are integrated implementation history. The `1.2.0` version in this branch is a release candidate only; it does not create human approval, W10 evidence, a Git tag, test-mirror deployment proof for this candidate, or stable-production publication.')
          insert_after_once(release,
              'Exact commit and run identities live in immutable Git/GitHub Actions history rather than this status file.\n',
              '\n## v1.2.0 post-tester candidate\n\nThe candidate groups the accepted tester-driven delta without changing learning semantics:\n\n- **A — Progress & Session Clarity:** lesson completion is separated from skill state; persistent step N/10; truthful local-save status; Today due-review clarity; saved Diagnostic continuation progress.\n- **B — Continuity & Real-Hand Safety:** reload-safe Today/Review return; unfinished Real Hand local draft; zero learner evidence before lock; local-save acknowledgement before draft clear; profile isolation; display-only complete-record example.\n- **C — Mobile & Test Access:** denser but complete mobile decision options with a 48px target floor; distinct invalid/offline/service-unavailable invite states; persisted RU/EN invite-gate locale.\n\nFeature freeze is active. Further product changes require empirical real-use evidence, except independently verified P0/P1 defects. This is implementation-complete **for real-use validation**, not evidence that retention, mastery or field transfer have been empirically validated.\n\n`v1.2.0` tag: **NOT CREATED** in the candidate branch.\n\n')

          ledger = app / 'ACCEPTANCE_LEDGER.md'
          replace_once(ledger,
              'Status: `POST_INTEGRATION_INTEGRITY_HARDENED / HUMAN_CONTENT_LANGUAGE_REVIEW_PENDING / W10_PENDING`',
              'Status: `POST_TESTER_A_B_C_IMPLEMENTATION_COMPLETE / VERSION_1_2_0_CANDIDATE / FEATURE_FREEZE / HUMAN_CONTENT_LANGUAGE_REVIEW_PENDING / W10_PENDING`')
          insert_after_once(ledger, 'Earlier bounded dispositions remain historical implementation dispositions only:\n',
              '\nPost-Tester Waves A/B/C are accepted and integrated implementation work. The `1.2.0` version in this branch is only a candidate checkpoint; it does not satisfy human review, W10 or W11. Feature freeze now rejects unsupported synthetic feature work by default: reopening requires empirical real-use evidence or an independently verified P0/P1 defect.\n')
          insert_after_once(ledger,
              '- W5 historical implementation disposition: `WAVE_5_IMPLEMENTATION_CLOSED_WITH_ACCEPTED_P2_DEBT`.\n',
              '\n## Post-Tester A/B/C implementation closure\n\n- Wave A: progress/session clarity — lesson-vs-skill truth, step N/10, save acknowledgement, due-review clarity and Diagnostic continuation.\n- Wave B: continuity/Real-Hand safety — reload-safe origin, local drafts with zero evidence before lock, acknowledged-save clearing, profile isolation and a display-only record-format example.\n- Wave C: mobile/test-access truth — compact full-text mobile options, 48px target floor, typed invite failure states and persistent RU/EN gate locale.\n\nNo curriculum, correct-answer, scheduler, mastery, evidence, learner-schema, reviewer-authority or human-approval semantics are upgraded by this release label.\n')

          (app / 'tests/version-closure.test.mjs').write_text('''import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport test from "node:test";\nimport { APP_VERSION, CONTENT_VERSION, STATE_SCHEMA_VERSION, emptyLearnerState, migrateLearnerState, validateLearnerState } from "../lib/model-core.ts";\n\nconst packageJson = JSON.parse(await readFile(new URL("../package.json", import.meta.url), "utf8"));\nconst packageLock = JSON.parse(await readFile(new URL("../package-lock.json", import.meta.url), "utf8"));\nconst shell = await readFile(new URL("../components/LiveCashApp.tsx", import.meta.url), "utf8");\n\ntest("v1.2.0 version sources and visible identity stay synchronized", () => {\n  assert.equal(packageJson.version, "1.2.0");\n  assert.equal(packageLock.version, packageJson.version);\n  assert.equal(packageLock.packages[""].version, packageJson.version);\n  assert.equal(APP_VERSION, packageJson.version);\n  assert.equal(STATE_SCHEMA_VERSION, 2);\n  assert.equal(CONTENT_VERSION, "2026.08-wave7-integrity");\n  assert.match(shell, /import \\{ APP_VERSION \\} from "\\.\\.\\/lib\\/model"/u);\n  assert.match(shell, /data-app-version=\\{APP_VERSION\\}/u);\n  assert.match(shell, /Live Cash OS v\\{APP_VERSION\\} · Build \\{buildLabel\\}/u);\n  assert.match(shell, /VITE_BUILD_SHA/u);\n  assert.match(shell, /data-build-sha=\\{rawBuildSha\\}/u);\n});\n\ntest("schema-v2 state from app 1.1.0 remains valid without evidence mutation", () => {\n  const prior = emptyLearnerState();\n  prior.appVersion = "1.1.0";\n  prior.revision = 7;\n  const before = structuredClone(prior);\n  assert.equal(validateLearnerState(prior), true);\n  const migrated = migrateLearnerState(prior);\n  assert.equal(validateLearnerState(migrated), true);\n  assert.equal(migrated.schemaVersion, 2);\n  assert.equal(migrated.appVersion, "1.2.0");\n  assert.equal(migrated.contentVersion, before.contentVersion);\n  assert.equal(migrated.revision, before.revision);\n  assert.deepEqual(migrated.modules, before.modules);\n  assert.deepEqual(migrated.interactions, before.interactions);\n  assert.deepEqual(migrated.reviewQueue, before.reviewQueue);\n  assert.deepEqual(migrated.cards, before.cards);\n  assert.deepEqual(migrated.fieldNotes, before.fieldNotes);\n  assert.deepEqual(migrated.diagnostic, before.diagnostic);\n  assert.deepEqual(migrated.activeSession, before.activeSession);\n});\n''', encoding='utf-8')

          (app / 'e2e/version-closure.spec.mjs').write_text('''import { expect, test } from "@playwright/test";\n\ntest("v1.2.0 footer exposes canonical app and local build identity without overflow", async ({ page }) => {\n  await page.goto("/");\n  const footer = page.locator("footer[data-build-sha][data-app-version]");\n  await expect(footer).toBeVisible();\n  await expect(footer).toHaveAttribute("data-app-version", "1.2.0");\n  await expect(footer).toHaveAttribute("data-build-sha", "local");\n  await expect(footer).toContainText("Live Cash OS v1.2.0 · Build local");\n  const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth);\n  expect(overflow).toBe(false);\n});\n''', encoding='utf-8')

          # Lawful deterministic fingerprint refresh; approvals remain empty/pending.
          manifest_path = app / 'content/i18n/editorial-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('human_approvals') != {} or manifest.get('strategy_approval') is not None or manifest.get('drill_approval') is not None:
              raise RuntimeError('approval truth unexpectedly changed')
          shell_bytes = shell.read_bytes()
          shell_blob = hashlib.sha1(f'blob {len(shell_bytes)}\0'.encode() + shell_bytes).hexdigest()
          manifest['source_blobs']['components/LiveCashApp.tsx'] = shell_blob
          canonical = '\n'.join(f'{path}={sha}' for path, sha in sorted(manifest['source_blobs'].items()))
          fingerprint = hashlib.sha256(canonical.encode()).hexdigest()
          manifest['final_composition']['status'] = 'REVIEW_PENDING'
          manifest['final_composition']['current_digest'] = fingerprint
          manifest['final_composition']['approved_digest'] = None
          manifest['final_composition']['review_corpus_fingerprint'] = fingerprint
          manifest['final_composition']['note'] = 'Gauntlet 4, final shell cleanup, bounded post-integration workflow-integrity repairs, the Wave C bilingual test-invite gate, and the v1.2.0 release identity are materialized in the review corpus. The strategic claim corpus and correct-answer identities are unchanged. Strategy, drills, exact RU/EN human review and final composition approval remain pending; this deterministic fingerprint refresh is not a human approval.'
          write_json(manifest_path, manifest)
          PY
      - name: Install dependencies
        working-directory: apps/live-cash-os
        run: npm ci --no-audit --no-fund
      - name: Validate bounded candidate before commit
        working-directory: apps/live-cash-os
        run: npm test
      - name: Remove bootstrap workflow and commit candidate
        shell: bash
        run: |
          rm .github/workflows/version-closure-bootstrap.yml
          git diff --check
          git status --short
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: prepare Live Cash OS v1.2.0 candidate"
          git push origin HEAD:release/v1.2.0-post-tester-closure
