name: V6 Wave A targeted validation

on:
  push:
    branches:
      - openai/v6-wave-a-adaptive-repetition-mastery-transparency

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/live-cash-os
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/live-cash-os/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck affected runtime
        run: npm run typecheck
      - name: Targeted mastery and scheduler tests
        run: >-
          node --import ./tests/register-model-loader.mjs --test
          tests/v6-adaptive-repetition-mastery-transparency.test.mjs
          tests/practical-integrated-a11.test.mjs
          tests/v6-quick-start-reachability.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Targeted Chromium evidence
        run: npx playwright test e2e/v6-adaptive-repetition-mastery-transparency.spec.mjs --project=chromium
