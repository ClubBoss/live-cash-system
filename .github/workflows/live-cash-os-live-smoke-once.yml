name: Live Cash OS Production Smoke

on:
  push:
    branches: [main]
    paths:
      - "apps/live-cash-os/**"
      - ".github/workflows/live-cash-os-live-smoke-once.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-cash-os-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/live-cash-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/live-cash-os/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke stable production URL
        env:
          LIVE_URL: https://live-cash-os.elmarsal.chatgpt.site/
          SMOKE_ATTEMPTS: "1"
          SMOKE_WAIT_MS: "0"
        run: node scripts/production-smoke.mjs
      - name: Upload production smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-cash-os-production-smoke
          path: apps/live-cash-os/smoke-evidence
          if-no-files-found: ignore
          retention-days: 14
