  grade_3_result: >-
    Grade 3 closes advanced postflop lecture continuity, including four-bet
    low-SPR reasoning, but does not close exact preflop, deep-stack, multiway
    or live-population boundaries.
  final_rule_count_correction: >-
    No numerical final-rule target is binding. The rule count is an optimisation
    output under minimum complexity subject to no material EV loss.
  priority_correction: >-
    Known learner discomfort and source gaps are diagnostic inputs. System-wide
    Max-EV determines priority.

