truth_boundaries:
- learner-runtime admission is not final-rule admission
- diagnostic readiness is not learner mastery
- user-reported pain points are priors not confirmed leaks
- untested mechanisms remain unmeasured
- one response cannot confirm a leak
- content completion cannot create retention
- raw field notes cannot create field validation
- population magnitudes remain field-gated
- repo green is not live deployment green
- accepted v1 remains production truth while v1.1 is a release candidate
- machine-generated translation drafts are not accepted copy
