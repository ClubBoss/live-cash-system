mission:
  summary: >-
    Build a compact, adaptive and interactive No-Limit Hold'em live-cash
    learning system for a strong MTT player moving into live 1/3 and 2/5.
  final_rule_target: 14-18
  target_games:
    stakes: [1/3, 2/5]
    common_effective_depth_bb: 100-200
    occasional_effective_depth_bb: 300-400
    environment: Batumi live cash
    may_include: [straddles, short_effective_stacks]
  learner_priorities:
    - sb_vs_bb
    - bb_defence
    - blind_range_identity
    - deep_stack_cash_translation
    - oop_vs_frequent_3bets
    - protected_passive_ranges
    - three_bet_pot_ancestry
    - multiway_structure
    - river_range_reconstruction
  learner_constraints:
    minimal_chart_memorisation: true
    compact_heuristics: true
    adaptive_interactive_sessions: true
    prediction_before_feedback: true
    score_action_and_reason_separately: true
    spaced_repetition: true
    live_field_transfer: true

