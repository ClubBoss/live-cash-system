schema_version: 1
project:
  name: Live Cash System
  repository: ClubBoss/live-cash-system
  default_branch: main
  state_authority: repository_over_chat_memory
  phase: post_source_evidence_closure
  updated_at: 2026-08-06T04:05:00+04:00

mission:
  summary: >-
    Build a compact, adaptive and interactive No-Limit Hold'em live-cash
    learning system for a strong MTT player moving into live 1/3 and 2/5.
  final_rule_policy: minimum_complexity_subject_to_no_material_ev_loss
  final_rule_count: emergent_not_fixed
  target_games:
    stakes: [1/3, 2/5]
    common_effective_depth_bb: 100-200
    occasional_effective_depth_bb: 300-400
    environment: Batumi live cash
    may_include: [straddles, short_effective_stacks]

priority_policy:
  authority: system_wide_max_ev
  personal_discomfort_is_input_not_priority: true
  source_order_is_not_priority: true
  factors:
    - spot_frequency
    - average_error_cost
    - current_error_probability
    - transfer_value
    - learnability_per_unit_time
    - evidence_confidence
  current_error_probability_state: incompletely_measured
  current_ranking: neutral_prior_v0_1

